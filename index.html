<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주</title>
<meta name="description" content="생년월일시와 태어난 곳으로 사주팔자를 풀어 드립니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main class="wrap">

<header class="hero">
  <h1>사주 <span class="hanja">四柱</span></h1>
</header>

<form id="form" class="panel" novalidate aria-label="출생 정보">

  <h2 class="group-title">나</h2>
  <div class="group">
    <label class="row">
      <span class="row-label">이름</span>
      <input id="name" class="row-input" type="text" maxlength="20" autocomplete="off" placeholder="선택">
    </label>
    <div class="row">
      <span class="row-label" id="g-label">성별</span>
      <div class="seg" role="radiogroup" aria-labelledby="g-label">
        <label><input type="radio" name="gender" value="M"><span>남</span></label>
        <label><input type="radio" name="gender" value="F"><span>여</span></label>
      </div>
    </div>
  </div>

  <h2 class="group-title">태어난 날</h2>
  <div class="group">
    <div class="row">
      <span class="row-label" id="c-label">달력</span>
      <div class="seg" role="radiogroup" aria-labelledby="c-label">
        <label><input type="radio" name="cal" value="solar" checked><span>양력</span></label>
        <label><input type="radio" name="cal" value="lunar"><span>음력</span></label>
      </div>
    </div>
    <div class="row">
      <span class="row-label">날짜</span>
      <div class="nums">
        <input id="y" class="num w4" type="text" inputmode="numeric" autocomplete="off" aria-label="년"><span class="unit">년</span>
        <input id="m" class="num" type="text" inputmode="numeric" autocomplete="off" aria-label="월"><span class="unit">월</span>
        <input id="d" class="num" type="text" inputmode="numeric" autocomplete="off" aria-label="일"><span class="unit">일</span>
      </div>
    </div>
    <label class="row" id="leap-wrap" hidden>
      <span class="row-label">윤달</span>
      <span class="toggle"><input id="leap" type="checkbox"><span class="switch" aria-hidden="true"></span></span>
    </label>
    <div class="row">
      <span class="row-label">시각</span>
      <div class="nums">
        <input id="th" class="num" type="text" inputmode="numeric" autocomplete="off" aria-label="시 (0~23)"><span class="unit">시</span>
        <input id="tm" class="num" type="text" inputmode="numeric" autocomplete="off" aria-label="분"><span class="unit">분</span>
      </div>
    </div>
    <label class="row">
      <span class="row-label">시각 모름</span>
      <span class="toggle"><input id="t-unknown" type="checkbox"><span class="switch" aria-hidden="true"></span></span>
    </label>
  </div>
  <p class="group-foot">시각은 24시간 기준으로 적어 주세요. 오후 3시는 15시입니다.</p>

  <h2 class="group-title">태어난 곳</h2>
  <div class="group">
    <label class="row">
      <span class="row-label">시·도</span>
      <select id="sido" class="row-select"><option value="">선택</option></select>
    </label>
    <label class="row">
      <span class="row-label">시·군·구</span>
      <select id="sgg" class="row-select" disabled><option value="">선택</option></select>
    </label>
    <label class="row">
      <span class="row-label">태어난 곳 모름</span>
      <span class="toggle"><input id="p-unknown" type="checkbox"><span class="switch" aria-hidden="true"></span></span>
    </label>
  </div>

  <h2 class="group-title">질문</h2>
  <div class="group pad">
    <div class="chips" id="cats" role="group" aria-label="질문 분야"></div>
    <div class="chips sub" id="qs" role="group" aria-label="구체적인 질문" hidden></div>
    <textarea id="question" rows="2" maxlength="300" placeholder="무엇이 궁금하세요?" aria-label="질문"></textarea>
    <span class="count" id="q-count">0 / 300</span>
  </div>

  <p class="error" id="form-err" role="alert" hidden></p>
  <button type="submit" class="primary">사주 보기</button>
</form>

<section class="panel" id="result" hidden aria-labelledby="res-title">
  <h2 class="panel-title" id="res-title">사주팔자 <span class="hanja">四柱八字</span></h2>
  <p class="meta" id="res-meta"></p>
  <div class="pillars" id="pillars"></div>

  <h3>오행</h3>
  <p class="hint">여덟 글자에 나무·불·흙·쇠·물의 기운이 각각 몇 개씩 있는지 보여줍니다.</p>
  <div class="elements" id="elements"></div>

  <div id="dw-wrap">
    <h3>대운</h3>
    <p class="hint">10년마다 바뀌는 인생의 큰 흐름입니다. 지금 지나고 있는 시기를 표시했습니다.</p>
    <div class="daewoon" id="daewoon"></div>
  </div>
</section>

<section class="panel" id="reading-card" hidden aria-labelledby="rd-title">
  <h2 class="panel-title" id="rd-title">풀이</h2>
  <div id="key-wrap" hidden>
    <div class="group">
      <label class="row">
        <span class="row-label">OpenAI API 키</span>
        <input id="key" class="row-input" type="password" autocomplete="off" placeholder="sk-...">
      </label>
    </div>
    <p class="group-foot">키는 이 탭에만 임시 저장되고 OpenAI 외에는 보내지 않습니다.</p>
  </div>
  <button type="button" id="ai-btn" class="primary" hidden>풀이 보기</button>
  <p class="status" id="ai-status" aria-live="polite"></p>
  <div id="qa"></div>
  <div id="reading"></div>
  <div id="follow" class="follow" hidden>
    <h3>더 물어보기</h3>
    <div id="f-qa" class="qa-list"></div>
    <div class="chips" id="f-chips" role="group" aria-label="추가 질문 예시"></div>
    <textarea id="f-question" rows="2" maxlength="300" placeholder="무엇이 더 궁금하세요?" aria-label="추가 질문"></textarea>
    <button type="button" id="ask-btn" class="primary">질문하기</button>
  </div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script src="places.js"></script>
<script src="saju.js"></script>
<script src="llm.js"></script>
<script src="app.js"></script>
</body>
</html>
